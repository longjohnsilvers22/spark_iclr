# SPARK Benchmark Configuration
benchmark:
  default_episodes: 50
  headless: true
  output_dir: "results"

# Task suites
suites:
  pick_place:
    tasks:
      - pick_place_easy
      - pick_place_medium
      - pick_place_hard
    episodes_per_task: 50

# Perturbation sweep settings (Colosseum-style)
perturbation:
  axes:
    - object_size
    - lighting_intensity
    - friction
    - mass
    - camera_position
  levels: [0.0, 0.25, 0.5, 0.75, 1.0]
  episodes_per_combination: 20

# Methods to compare
methods:
  - random     # Random action baseline
  - scripted   # Hardcoded pick-place sequence
  - spark      # Full SPARK pipeline (LLM + perception + BT)

# Success thresholds
thresholds:
  easy: 0.05     # 5cm
  medium: 0.03   # 3cm
  hard: 0.015    # 1.5cm
