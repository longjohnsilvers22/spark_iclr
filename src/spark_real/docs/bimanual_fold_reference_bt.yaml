# Reference behavior tree for the bimanual t-shirt fold
# (Panda left + FR3 right + SSG-48 jaws + static rear ZED Mini).
#
# Hardware-validated fold plan expressed as a SPARK score over the bimanual
# cloth primitives, kept as an in-context example in the spirit of the BT
# cache: successful plans from completed tasks are offered back to the planner.
# The planner is shown this ONLY for the bimanual_franka family, as an example
# to imitate when the instruction is "fold the shirt" / "fold the t-shirt".
#
# Two ways to express it:
#
#   A) One leaf: bimanual_shirt_fold orchestrates detect -> sleeves ->
#      re-perceive -> hem internally. PREFER THIS for a plain fold request.
#
#   B) Explicit primitive chain (below): use when the task needs custom
#      grasp/land points or partial folds. Each phase re-perceives; do NOT
#      hardcode coordinates across phases.
#
# Key validated facts encoded here:
#   - sleeve grasps are the OUTER-EDGE (tip) points; per-sleeve OBB-minor-axis
#     jaw yaw; RIGHT arm folds the camera-LEFT sleeve and vice versa.
#   - both arms grasp, then LIFT TOGETHER (durations equalized), then arc-drape.
#   - sleeves drape to the garment-center y one phase, hem corners come from the
#     DEPTH-VALID cloud (lowest-x band, +/-y extremes) after RE-DETECTION.
#   - left jaw yaw = right yaw + 90 deg mount offset + 180 deg camera flip
#     (applied automatically by the skill; the BT passes the same yaw to both).
#   - hem x offsets (right/left) and the left 180 deg flip come from the family
#     profile cloth() block (configs/machines/ANON-LAB.yaml cloth:).
#   - SSG-48 raw >= 250 on a jaw means it closed on air: the grasp primitive
#     FAILS the skill so a replan/recovery can fire.

# --- Option A: single orchestrator leaf (preferred) ---
task: fold the t-shirt (bimanual, ANON-LAB)
tree:
  type: sequence
  children:
    - type: bimanual_shirt_fold
      params:
        instruction: "fold the t-shirt"

