# "put the pen in the bin" -- 55 human episodes.
#
# Scene (verified against camera_1/frame_0000): a blue cylindrical bin
# standing upright at table-left with a dark open top, and a thin black
# pen lying on the bare table to its right.
#
# The pen is the hardest single object in the whole corpus: a few hundred
# pixels of low-saturation dark grey against a mid-grey table. min_conf is
# deliberately at the floor here and the alt_prompts carry real weight.
task: "put the pen in the bin"
aliases:
  - "place the pen in the bin"
  - "pick up the pen and place in the bin on the tan button"
  - "put the pen on the tan button"
  - "place the pen on the lid button"
  - "pick up the pen and place it in the bin"
  - "put pen in bin"

groups:
  - text: "pen"
    expect: {min: 1, max: 1}
    min_conf: 0.05
    alt_prompts: ["black pen", "ballpoint pen", "marker"]

  - text: "bin"
    expect: {min: 1, max: 1}
    min_conf: 0.10
    # "bin" alone can ground on the whole table edge; the colour adjective
    # is what pins it to the cylinder.
    alt_prompts: ["blue bin", "blue container", "blue cylindrical container"]

  # The lid button. Measured 2026-08-20 on the live rig, one detect per
  # phrase: "tan circle" 0.49, "beige button" 0.28, "tan button" 0.18,
  # "button" 0.10 -- all four landing on the SAME ~140 px blob at z=-0.058,
  # which is what makes it trustworthy. "button on lid" is deliberately NOT
  # here: it grounds on the whole lid (5159 px) at 0.08.
  #
  # Ordered strongest-first. The primary text is what the operator says
  # ("...on the tan button"); the alt_prompts carry the detection.
  - text: "tan button"
    expect: {min: 0, max: 1}
    min_conf: 0.08
    alt_prompts: ["tan circle", "beige button", "button"]

fallback:
  relax_secondary_score: 0.30
  on_mismatch: abort
