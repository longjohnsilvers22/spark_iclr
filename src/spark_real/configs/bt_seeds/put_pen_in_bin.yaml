todo: true
todo_reason: >-
  No pen/bin tree has ever run successfully on this rig. Candidate below is
  a label swap of the verified knife->tray pick-place, not a capture.
instruction: "put the pen in the bin"
aliases:
  - "pick up the pen and place it in the bin"
  - "place the pen in the bin"
  - "put pen in bin"
objects: ["pen", "bin"]
priority: 10
promote: false
verified: false
provenance: >-
  Candidate only. Structure from 0b20251e4902 ("pick up knife and place it
  in the tray", success=1 fail=0) with knife handle -> pen and tray -> bin.
notes: >-
  Grasp force/width copied from the knife tree (50 N, 1 cm) because a pen
  is a similar thin cylinder. Release offset over the bin is 0.10 rather
  than the tray's 0.05: a bin has walls, and the gripper needs to clear
  the rim before opening.
score:
  task: "put the pen in the bin"
  tree:
    type: sequence
    children:
      - type: move_to_keypoint
        params: {keypoint_label: "pen", offset_z: 0.0}
      - type: grasp
        params: {force: 50, target_width: 0.01}
      - type: move_relative
        params: {dx: 0.0, dy: 0.0, dz: 0.2}
      - type: move_to_keypoint
        params: {keypoint_label: "bin", offset_z: 0.10}
      - type: release
        params: {tilt_angle: 0.0}
