# CoRL pen draw task BT
# Sequence: top-down grasp flat pen -> roll tip-down -> compute tip offset ->
#           lower to notebook -> draw circle -> lift -> release
#
# This BT uses existing skills from spark_real:
#   - move_to_keypoint (primitives.py)
#   - grasp (primitives.py)
#   - move_relative (primitives.py)
#   - release (primitives.py)
#
# The "roll tip-down" step is a wrist rotation; in simulation we implement
# it as a combined pitch+roll in the test script.
# The "draw circle" step is a series of move_relative calls tracing a
# circular XY pattern at constant Z (pen tip on notebook surface).
#
# Grip offset calculation:
#   Pen length = 150mm, half-height = 75mm, tip geom adds 3mm.
#   Gripped at centre -> pen tip extends 78mm below TCP after 90-deg roll.
#   Drawing Z = notebook_surface_z + offset (0.003 + 0.078 = 0.081)

name: pen_draw
description: >
  Pick up a pen lying flat on the table, rotate the wrist so the pen tip
  points downward, compute the grip-to-tip offset, lower the pen tip to
  the notebook surface, draw a circle pattern, then lift and release.
  Demonstrates tool-use with grip offset calculation.

sequence:
  # Approach pen from above
  - action: move_to_keypoint
    params:
      keypoint_label: "pen"
      offset_x: 0.0
      offset_y: 0.0
      offset_z: 0.02

  # Top-down grasp across pen body
  - action: grasp
    params:
      force: 40

  # Lift pen off table
  - action: move_relative
    params:
      dx: 0.0
      dy: 0.0
      dz: 0.20

  # Roll wrist 90 degrees so pen tip points down.
  # In real-robot execution this is a combined pitch+roll via
  # move_to_keypoint with orientation override.
  # In sim, the test script handles the SE(3) rotation directly.

  # Transport to above notebook centre
  - action: move_to_keypoint
    params:
      keypoint_label: "notebook"
      offset_x: 0.0
      offset_y: 0.0
      offset_z: 0.10

  # Lower pen tip to notebook surface.
  # TCP_z = notebook_z + pen_half_height = 0.003 + 0.075 = 0.078
  # From 0.10 above notebook (z~0.103) to z=0.078:
  - action: move_relative
    params:
      dx: 0.0
      dy: 0.0
      dz: -0.025

  # Draw circle: series of XY moves at constant Z.
  # Circle radius = 30mm, 16 waypoints per cycle, 4 cycles.
  # Each waypoint is a small delta from the previous position.
  # (In sim, the test script generates the full circle trajectory.)

  # Lift pen off notebook
  - action: move_relative
    params:
      dx: 0.0
      dy: 0.0
      dz: 0.10

  # Release pen
  - action: release
    params: {}
