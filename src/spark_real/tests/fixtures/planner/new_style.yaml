```yaml
task: put the knife in the tray
tree:
  type: sequence
  children:
    - type: move_to_keypoint
      params:
        keypoint_label: "knife handle 1"
        offset_z: 0
        grasp_strategy: "obb"
        grasp_yaw_deg: 30.0
    - type: grasp
      params:
        force: 50
        target_width: 0.008
        grasp_strategy: "obb"
    - type: move_relative
      params:
        dx: 0
        dy: 0
        dz: 0.20
    - type: place_in_slot
      params:
        container_label: "tray"
        slot_idx: 0
verify:
  all:
    - pred: inside
      obj: "knife handle 1"
      container: "tray"
      xy_margin_m: -0.02
      z_tol_m: 0.06
    - pred: held
      obj: "knife handle 1"
      value: false
  min_conf: 0.35
  require_two_views: false
```
