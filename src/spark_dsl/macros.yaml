macros:
- name: pick_and_place
  support: 34
  distinct_tasks: 34
  bound_params:
    node0.offset_z: 0
    node1.force: 100
    node2.dz: 0.2
    node3.offset_z: 0.05
  free_params:
    node0.keypoint_label:
      example: black ceramic bowl
      n_distinct: 31
    node3.keypoint_label:
      example: white ceramic plate
      n_distinct: 28
  body:
  - type: move_to_keypoint
    params:
      keypoint_label: <node0.keypoint_label>
      offset_z: 0
  - type: grasp
    params:
      force: 100
  - type: move_relative
    params:
      dz: 0.2
  - type: move_to_keypoint
    params:
      keypoint_label: <node3.keypoint_label>
      offset_z: 0.05
  - type: release
    params: {}
  example_tasks:
  - Pick the akita black bowl between the plate and the ramekin and place it on the
