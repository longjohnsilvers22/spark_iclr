name: openvla_env
# Exported from the lab openvla_env (LIBERO / LIBERO-PRO / LIBERO-Dyn runs). libero itself comes from src/libero_pro on PYTHONPATH; openvla and other editable checkouts are installed separately for the VLA baselines.
# dlimp (OpenVLA data loader, git-only, conflicts with the tensorflow pin) is left out; install it by hand only for the OpenVLA baseline.
channels:
  - defaults
  - conda-forge
dependencies:
  - _libgcc_mutex=0.1
  - _openmp_mutex=5.1
  - binutils_impl_linux-64=2.44
  - binutils_linux-64=2.44
