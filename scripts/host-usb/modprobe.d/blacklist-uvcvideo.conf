# Blacklist uvcvideo to prevent xHCI TRB ring corruption on USB 3.0.
# Azure Kinect uses libk4a (libusb) and RealSense uses the pyrealsense2 rsusb
# backend; neither needs the kernel UVC driver. The bind/unbind race between
# uvcvideo and libusb under sustained streaming can crash the host.
blacklist uvcvideo
